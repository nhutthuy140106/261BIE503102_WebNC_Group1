<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:"Segoe UI",Arial,sans-serif;color:#22304A;width:1400px}
.wrap{padding:22px 26px 22px}
.grid{position:relative;display:grid;grid-template-columns:330px repeat(33,1fr);border-top:1px solid #d9dfe8;border-left:1px solid #d9dfe8}
.c{border-right:1px solid #e6eaf1;border-bottom:1px solid #e6eaf1;min-height:34px;display:flex;align-items:center;font-size:13.5px}
.h{background:#1F4E79;color:#fff;justify-content:center;font-size:11px;font-weight:600;min-height:30px}
.hm{background:#163a5a;color:#fff;justify-content:center;font-size:12.5px;font-weight:700;min-height:28px}
.n{padding:0 10px;font-weight:600;background:#f6f8fb}
.n small{font-weight:400;color:#6A6879;margin-left:6px;font-size:11.5px}
.w{background:#fafbfd}
.bar{height:20px;border-radius:5px;align-self:center;margin:0 1px}
.b1{background:#2E75B6}.b2{background:#D85A1C}.b3{background:#4a9d6f}.b4{background:#7a63b8}
.leg{display:flex;gap:22px;margin-top:12px;font-size:12.5px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
</style></head><body><div class="wrap" id="root"></div>
<script>
// Ngày 16/10 = cột 1 ... 17/11 = cột 33. Dùng chỉ số ngày từ 16/10.
const start=new Date(2026,9,16);
const days=[];for(let i=0;i<33;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}
const idx=(m,d)=>Math.round((new Date(2026,m-1,d)-start)/86400000);
const rows=[
 ['Bản mẫu giao diện HTML','16–17/10',[10,16],[10,17],'b1'],
 ['Khung Angular, quy trình Git','18/10',[10,18],[10,18],'b1'],
 ['Nối API, giao diện Mua và Bán','19–25/10',[10,19],[10,25],'b1'],
 ['Đơn hàng, nhận việc, AntXu','22–29/10',[10,22],[10,29],'b1'],
 ['Tìm kiếm, gợi ý, trợ lý','23–30/10',[10,23],[10,30],'b2'],
 ['Đăng nhập Google, Quay món','29–30/10',[10,29],[10,30],'b1'],
 ['Phân tích nghiệp vụ, sơ đồ','3–11/11',[11,3],[11,11],'b3'],
 ['Dữ liệu thật của các thành viên','10–11/11',[11,10],[11,11],'b3'],
 ['Server hoàn chỉnh phía Mua','12/11',[11,12],[11,12],'b2'],
 ['API phía Bán, số liệu gian hàng','14/11',[11,13],[11,14],'b2'],
 ['Khu quản trị (admin)','15–16/11',[11,15],[11,16],'b2'],
 ['Chỉnh giao diện, giao diện tối','16–17/11',[11,16],[11,17],'b1'],
 ['Viết báo cáo','5/11, 13–17/11',[11,5],[11,5],'b4'],
];
const root=document.getElementById('root');
let g='<div class="grid">';
// hàng tháng
g+='<div class="c hm" style="grid-column:1">Hạng mục</div>';
g+='<div class="c hm" style="grid-column:2 / span 16">Tháng 10/2026</div>';
g+='<div class="c hm" style="grid-column:18 / span 17">Tháng 11/2026</div>';
g+='<div class="c h" style="grid-column:1">Mốc theo lịch sử commit</div>';
days.forEach((d,i)=>{g+=`<div class="c h" style="grid-column:${i+2}">${d.getDate()}</div>`});
let r=3;
rows.forEach((x,ri)=>{
  const [name,when,a,b,cls]=x;
  const s=idx(a[0],a[1])+2,e=idx(b[0],b[1])+2;
  if(name){g+=`<div class="c n" style="grid-column:1;grid-row:${r}">${name}<small>${when}</small></div>`}
  else{g+=`<div class="c n" style="grid-column:1;grid-row:${r}"></div>`}
  for(let i=0;i<33;i++){g+=`<div class="c w" style="grid-column:${i+2};grid-row:${r}"></div>`}
  g+=`<div class="bar ${cls}" style="grid-column:${s} / ${e+1};grid-row:${r};z-index:2"></div>`;
  r++;
});
g+=`<div class="bar b4" style="grid-column:${idx(11,13)+2} / ${idx(11,17)+3};grid-row:15;z-index:2"></div>`;
g+='</div>';
g+='<div class="leg"><span><i class="b1"></i>Giao diện và chức năng chính</span><span><i class="b2"></i>Máy chủ, thuật toán, quản trị</span><span><i class="b3"></i>Phân tích và dữ liệu</span><span><i class="b4"></i>Báo cáo</span></div>';
root.innerHTML=g;
</script></body></html>
