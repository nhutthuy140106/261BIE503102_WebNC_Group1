<app-auth-shell>
  <h1>Đăng nhập</h1>
  <p class="why">{{ why }}</p>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <label for="phone">Số điện thoại</label>
    <input id="phone" class="tx" formControlName="phone" name="username" autocomplete="username" inputmode="numeric" maxlength="10"
           [class.is-invalid]="form.controls.phone.invalid && form.controls.phone.touched" />
    @if (form.controls.phone.invalid && form.controls.phone.touched) {
      <small class="error">Số điện thoại gồm 10 số, bắt đầu bằng 0.</small>
    }

    <label for="password">Mật khẩu</label>
    <app-password-input inputId="password" autocomplete="current-password" formControlName="password"
                        [invalid]="form.controls.password.invalid && form.controls.password.touched" />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <small class="error">Mật khẩu tối thiểu 6 ký tự.</small>
    }

    <label class="remember"><input type="checkbox" formControlName="rememberMe" /> Ghi nhớ đăng nhập</label>

    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }

    <button type="submit" class="go" [disabled]="form.invalid || submitting()">Đăng nhập</button>
  </form>
  <p class="alt" foot>Chưa có tài khoản? <a routerLink="/auth/register">Đăng ký</a></p>
</app-auth-shell>
