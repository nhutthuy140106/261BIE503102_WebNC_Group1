<section>
  <div class="filters">
    @for (f of filters; track f.key) {
      <button type="button" class="btn ghost" [class.active]="filter() === f.key" (click)="filter.set(f.key)">{{ f.label }}</button>
    }
  </div>
  @if (loading()) {
    <app-skeleton variant="cards" [count]="4" />
  } @else if (error()) {
    <div class="notice">Không tải được bài đã lưu: {{ error() }}</div>
  } @else {
    <div class="grid">
      @for (p of items(); track p._id) {
        @if (p.kind === 'job') {
          <app-job-card [job]="p" />
        } @else {
          <app-post-card [post]="p" [saved]="true" (toggleSave)="toggle($event)" />
        }
      } @empty {
        <div class="sempty"><img src="assets/clean/ant-saved.png" alt="" /><p>Chưa lưu gì ở mục này.<br />Bấm <svg class="i hrt"><use href="#heart" /></svg> trên bài để lưu lại xem sau nhé.</p></div>
      }
    </div>
  }
</section>
