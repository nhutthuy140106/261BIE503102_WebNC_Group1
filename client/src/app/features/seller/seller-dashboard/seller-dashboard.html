<h1>Tổng quan</h1>
@if (error()) {
  <div class="notice" role="alert">{{ error() }}</div>
} @else if (loading()) {
  <app-loader />
} @else {
  <div class="stats">
    @for (s of stats(); track s.label) {
      <a class="stat card" [class.hot]="s.hot" [routerLink]="s.link" [queryParams]="s.query">
        <strong>{{ s.value }}</strong>
        <span>{{ s.label }}</span>
      </a>
    }
  </div>
  <div class="quick">
    <a routerLink="/seller/posts/new" class="btn">Đăng bài mới</a>
    <a routerLink="/seller/transactions" class="btn ghost">Xem giao dịch</a>
  </div>
}
