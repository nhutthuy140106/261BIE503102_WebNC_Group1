<article class="card job">
  <div class="top">
    <span class="who muted">{{ job.sellerName }} · {{ job.block }}</span>
    @if (job.job?.status === 'open') {
      <span class="state open">Đang mở · {{ job.job?.offers }} đề nghị</span>
    } @else {
      <span class="state">Đã có người nhận</span>
    }
  </div>
  <h3><a [routerLink]="['/posts/job', slug]">{{ job.title }}</a></h3>
  <p class="desc muted">{{ job.description }}</p>
  <div class="row">
    <div>
      <div class="pay">{{ job.price | number }}đ</div>
      <small class="muted">{{ job.job?.due }}</small>
    </div>
    <button type="button" class="save" [class.on]="saved" (click)="toggleSave.emit(job)"
            [attr.aria-pressed]="saved" aria-label="Lưu việc">♡</button>
  </div>
</article>
