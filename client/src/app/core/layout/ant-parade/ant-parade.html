@if (parade(); as p) {
  <div class="lane" aria-hidden="true">
    @for (a of p.ants; track $index) {
      <span class="go" [class.rtl]="p.rtl" [style.animation-duration.s]="p.duration" [style.animation-delay.s]="a.delay" [style.bottom.px]="8 + a.lane">
        <span class="ant" [style.--s]="a.size"></span>
      </span>
    }
  </div>
}
