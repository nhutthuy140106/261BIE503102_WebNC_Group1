<header class="appbar">
  <div class="wrap bar">
    <div class="left">
      <a routerLink="/" class="logo" aria-label="AntGo - Trang chủ"><img src="assets/clean/logo-sm.png" alt="AntGo" /></a>
      <nav aria-label="Điều hướng chính">
        <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" title="Trang chủ">
          <svg class="i"><use href="#home" /></svg><span class="t">Trang chủ</span>
        </a>
        <a routerLink="/orders" routerLinkActive="on" title="Đơn hàng">
          <svg class="i"><use href="#receipt" /></svg><span class="t">Đơn hàng</span>
        </a>
        <a routerLink="/messenger" routerLinkActive="on" title="Messenger">
          <svg class="i"><use href="#chat" /></svg><span class="t">Messenger</span>
        </a>
      </nav>
    </div>

    <form class="hsearch" [class.away]="onHome() && search.hideCompact()" (submit)="$event.preventDefault(); onSearch()" role="search">
      <input type="search" [value]="search.text()" (input)="search.text.set($any($event.target).value)" [placeholder]="search.placeholder()" aria-label="Tìm kiếm" />
      <button type="button" class="sbtn" [class.rec]="search.recording()" title="Tìm bằng giọng nói" (click)="search.voice()"><svg class="i"><use href="#mic" /></svg></button>
      <button type="button" class="sbtn" title="Tìm bằng hình ảnh" (click)="search.pickImage()"><svg class="i"><use href="#camera" /></svg></button>
      <button type="submit" class="go" aria-label="Tìm"><svg class="i"><use href="#search" /></svg></button>
    </form>

    <div class="right">
      <div class="role" title="Đổi không gian">
        <button type="button" [class.on]="!sellMode()" (click)="setMode(false)">Mua</button>
        <button type="button" [class.on]="sellMode()" (click)="setMode(true)">Bán</button>
      </div>
      <button type="button" class="hbtn" title="Khu vực đang xem" (click)="area.open()">
        <svg class="i"><use href="#pin" /></svg>
        <span class="t">{{ area.current() }}</span>
        <svg class="i chev"><use href="#chev" /></svg>
      </button>
      <span class="sep"></span>
      @if (auth.isLoggedIn()) {
        <button type="button" class="xubtn" title="AntXu của bạn" (click)="openXu()">
          <img class="coin" src="assets/clean/antxu.png" alt="" />{{ xu.balance() }} Xu
        </button>
      }
      <a routerLink="/search" class="iconbtn msearch" title="Tìm kiếm" aria-label="Tìm kiếm"><svg class="i"><use href="#search" /></svg></a>
      <button type="button" class="iconbtn" id="savedBtn" title="Đã lưu" (click)="openSaved()">
        <svg class="i"><use href="#heart" /></svg>
        @if (saved.ids().length) { <span class="cnt">{{ saved.ids().length }}</span> }
      </button>
      @if (auth.isLoggedIn()) {
        <a routerLink="/notifications" class="iconbtn" title="Thông báo">
          <svg class="i"><use href="#bell" /></svg>
          @if (notifications.unreadCount()) { <span class="d"></span> }
        </a>
        <a routerLink="/profile" class="av" [title]="auth.currentUser()?.fullName ?? 'Tài khoản'">
          <app-avatar [src]="auth.currentUser()?.avatar" [name]="auth.currentUser()?.fullName" [size]="34" />
        </a>
      } @else {
        <a routerLink="/auth/login" class="login">Đăng nhập</a>
      }
    </div>
  </div>
</header>
