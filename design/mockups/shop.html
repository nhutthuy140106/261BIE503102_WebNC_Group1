      <section class="shophead">
        <div class="sh-top">${S.av ? `<img src="${U(S.av, 200, 200)}" alt="">` : ""}<div class="nm"><h1>${esc(name)}</h1><span class="kd">${esc(S.kind)}</span>
          <p><span>${icon("pin")}${esc(S.at)}</span><span>${icon("home")}${esc(S.since)}</span>${S.reply ? `<span>${icon("chat")}${esc(S.reply)}</span>` : ""}</p></div>
          <div class="sh-acts"><button class="fl${following ? " on" : ""}" id="fol">${icon(following ? "heartFill" : "heart")}${following ? "Đang theo dõi" : "Theo dõi"}</button><a class="msg" href="messenger.html?to=${encodeURIComponent(name)}">${icon("chat")}Nhắn tin</a></div></div>
        <div class="sh-stats"><div><b>${icon("star")}${S.rate}</b><span>${S.revs.length ? S.revs.length + " đánh giá" : "chưa có đánh giá"}</span></div><div><b>${S.posts.length + S.jobs.length}</b><span>bài đang đăng</span></div><div><b>${S.done}</b><span>${S.jobs.length && !S.posts.length ? "việc đã hoàn thành" : "đơn đã hoàn thành"}</span></div></div>
      </section>
      ${S.bio ? `<p class="bio">${esc(S.bio)}</p>` : ""}
      <div class="tabs">${tabs.map(([k, t, n]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${t}<small>${n}</small></button>`).join("")}</div>
      ${tab === "posts" ? `<div class="grid4">${S.posts.map(([p, img, k, t, pr, u]) => `<a class="pc" href="detail.html?p=${p}"><div class="ph"><img src="${U(img)}" alt="" loading="lazy"></div><span class="k">${k}</span><h3>${esc(t)}</h3><div class="pr">${money(pr)} <small>/ ${u}</small></div></a>`).join("")}</div>` : ""}
      ${tab === "jobs" ? `<div class="grid4">${S.jobs.map(([c, t, d, pr, u, n, open]) => `<a class="pc jc" href="job.html"><div class="ph"><p>${esc(d)}</p><b>${money(pr)}<small> / ${u}</small></b></div><span class="k">${c}</span><h3>${esc(t)}</h3>${open ? `<span class="jst">Đang mở · ${n ? n + " đề nghị" : "chưa có đề nghị"}</span>` : `<span class="jst closed">Đã có người nhận</span>`}</a>`).join("")}</div>` : ""}
      ${tab === "revs" ? (S.revs.length ? `<div class="revs">${S.revs.map(([w, av, st, t, txt, on]) => `<div class="rv"><img src="${U(av, 80, 80)}" alt=""><div><b>${w}</b><small>${t}</small><div class="st">${"★".repeat(st)}${"☆".repeat(5 - st)}</div><p>${esc(txt)}</p><span class="on">${esc(on)}</span></div></div>`).join("")}</div>` : `<div class="empty3">Chưa có đánh giá nào.</div>`) : ""}
      <p class="demo-note">Gian hàng mẫu — thông tin và số liệu là dữ liệu minh họa của bản mẫu.</p>`;
    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
    $("fol").onclick = () => { fol = following ? fol.filter(x => x !== name) : [...fol, name]; try { localStorage.setItem(SKEY, JSON.stringify(fol)); } catch (e) {} render(); };
  }
  render();
})();
</script></body></html>
