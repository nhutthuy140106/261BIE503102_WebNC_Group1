<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntGo — Messenger</title>
<link rel="stylesheet" href="shared/base.css"><style>
  .chat-layout{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 160px);min-height:540px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
  .chat-list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
  .chat-list-head{padding:18px;border-bottom:1px solid var(--border)}
  .chat-list-head h2{font-size:17px;margin:0 0 12px}.chat-list-head input{width:100%}
  .thread-list{overflow:auto;flex:1}.thread{width:100%;display:flex;align-items:center;gap:11px;padding:14px 18px;border:0;border-bottom:1px solid var(--border);background:#fff;text-align:left}
  .thread:hover,.thread.on{background:var(--soft)}.chat-top span.photo{display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:700;flex:none}.thread .photo{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  .thread .text{min-width:0;flex:1}.thread b,.thread small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread small{color:var(--smoke);margin-top:2px}
  .chat-main{display:flex;flex-direction:column;min-width:0}.chat-top{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}.chat-top h2{font-size:17px;margin:0}.chat-top small{color:var(--smoke)}
  .chat-top .context-link{margin-left:auto;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px;background:#FFFDFC}.bubble{max-width:min(68%,520px);align-self:flex-end;background:var(--ink);color:#fff;padding:10px 14px;border-radius:14px 14px 3px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble small{display:block;color:#d6dbe5;text-align:right;margin-top:4px;font-size:11px}
  .context-card{align-self:center;width:100%;max-width:520px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;font-size:13px;margin-bottom:6px}.context-card:hover{background:var(--soft)}.context-card span{flex:1;min-width:0}.context-card b{display:block}.context-card small{color:var(--smoke)}.context-card svg{width:18px;height:18px;color:var(--smoke)}
  .bubble.them{align-self:flex-start;background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:14px 14px 14px 3px}.bubble.them small{color:var(--fog);text-align:left}
  img.photo{object-fit:cover}.chat-top img.photo,.chat-top .photo{width:40px;height:40px;border-radius:50%}
  .thread .when{align-self:flex-start;display:grid;justify-items:end;gap:6px;font-size:11.5px;color:var(--fog);white-space:nowrap}.thread .when i{width:8px;height:8px;border-radius:50%;background:var(--accent)}.thread.unread b{font-weight:700}.thread.unread small{color:var(--ink);font-weight:500}
  .compose{border-top:1px solid var(--border);padding:14px 20px;display:flex;align-items:flex-end;gap:10px}.compose textarea{flex:1;min-height:42px;max-height:140px;resize:vertical}.compose .btn{min-height:42px}
  .samples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}.samples button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 12px;font-weight:600}
  @media(max-width:700px){.chat-layout{grid-template-columns:1fr;height:auto;min-height:0}.chat-list{max-height:220px;border-right:0;border-bottom:1px solid var(--border)}.chat-main{min-height:480px}.chat-top{padding:12px}.messages{min-height:300px}.compose{padding:10px}.bubble{max-width:88%}}
</style></head><body>
<div id="siteHeader" data-active="messenger"></div><main class="wrap"><div class="pagehead"><h1>Messenger</h1><p>Một hộp thư cho mọi cuộc trò chuyện trong AntGo.</p></div>
<div class="chat-layout"><aside class="chat-list"><div class="chat-list-head"><h2>Cuộc trò chuyện</h2><input id="findChat" class="input" placeholder="Tìm người hoặc nội dung"></div><div id="threadList" class="thread-list"></div></aside>
<section class="chat-main" id="chatMain"></section></div><p class="demo-note">Bản mẫu: tin nhắn chỉ được lưu trong trình duyệt này; gửi tin không tự thay đổi trạng thái đơn.</p></main>
<script src="shared/icons.js"></script><script src="shared/common.js"></script><script>
(() => {
  const key = "antgo_chats", q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  const esc = AntGo.esc, icon = AntGo.icon;
  const U = (id, w = 96) => `https://images.unsplash.com/photo-${id}?w=${w}&h=${w}&fit=crop&q=70`;
  const AV = { "Bếp Cô Lan":"1504674900247-0877df9cc836", "Tiệm Sạch Thơm":"1582735689369-4fe89db7114c", "Quốc Anh":"1500648767791-00dcc994a43e", "Chị Hoa":"1494790108377-be9c29b29330", "Chị Ngân":"1507003211169-0a1dd7228f2d", "Thu Hà":"1438761681033-6461ffad8d80", "Anh Tuấn":"1506794778202-cad84cf45f1d", "Chị Mai":"1544005313-94ddf0286df2" };
  // tên dễ hiểu cho đơn/bài đính kèm cuộc trò chuyện (thay vì mã nội bộ)
  const NAMES = { j1:"Mua đồ chợ sáng giúp nhà mình", j2:"Dọn phòng cuối tuần", j3:"Cho mèo ăn 3 ngày khi đi vắng", j4:"Lấy giúp phần cơm ở cổng sau", j5:"Phụ khiêng tủ lên tầng 12", j6:"Trông bé 2 tiếng tối thứ Sáu",
    o1:"Cơm nhà làm — cơm gà xé ×2", o2:"Giặt sấy gấp 5kg", o3:"Phở bò tái ×2",
    food:"Cơm nhà làm, thực đơn đổi mỗi ngày", goods:"Nồi chiên không dầu 5L", svc:"Giặt sấy gấp, lấy và trả tận cửa", fix:"Sửa laptop, điện thoại", clean:"Dọn nhà theo giờ", trip:"Lấy đồ hộ, giao nhận trong khu" };
  const ctxOrder = id => ({ label:(id[0] === "j" ? "Việc đã nhận · " : "Đơn đã đặt · ") + (NAMES[id] || id), href:"orders.html?id=" + id });
  const ctxPost = id => ({ label:"Bài đăng · " + (NAMES[id] || "Bài đăng"), href:"detail.html?p=" + id });
  // 3 cuộc trò chuyện mẫu: mở trang là thấy hộp thư đang dùng (chỉ tạo khi trình duyệt chưa có dữ liệu tin nhắn)
  const SEED = [
    { id:"s1", name:"Bếp Cô Lan", unread:1, contexts:[ctxOrder("o1")], messages:[
      { from:"me", text:"Cô ơi cho con ít cay một phần nha, phần còn lại bình thường.", time:"9:42" },
      { from:"them", text:"Được con, cô ghi chú rồi. 11:30 cô giao tận cửa nha.", time:"9:51" },
      { from:"them", text:"Cơm xong rồi, cô đang mang lên nè.", time:"11:24" } ] },
    { id:"s2", name:"Quốc Anh", contexts:[ctxOrder("j2")], messages:[
      { from:"them", text:"Chào bạn, mình chọn bạn rồi nhé. Chủ nhật 9h bạn qua được không?", time:"Hôm qua" },
      { from:"me", text:"Được anh ơi, 9h em có mặt. Dụng cụ nhà mình có sẵn hết phải không ạ?", time:"Hôm qua" },
      { from:"them", text:"Có đủ hết, chỉ cần bạn qua thôi.", time:"Hôm qua" } ] },
    { id:"s3", name:"Chị Hoa", contexts:[ctxOrder("j1")], messages:[
      { from:"me", text:"Chị ơi danh sách đồ chợ chị gửi em tối thứ Sáu nha. Em đi lúc 6:30.", time:"9:15" } ] },
  ];
  let chats; try { chats = JSON.parse(localStorage.getItem(key)); if (!Array.isArray(chats)) chats = null; } catch (e) { chats = null; }
  if (!chats) chats = JSON.parse(JSON.stringify(SEED));
  else {
    // Trình duyệt đã có dữ liệu cũ: bổ sung cuộc trò chuyện mẫu còn thiếu; cuộc nào trùng tên mà chưa có tin thì lấy tin mẫu
    SEED.forEach(sd => {
      const old = chats.find(c => c.name === sd.name);
      if (!old) chats.push(JSON.parse(JSON.stringify(sd)));
      else if (!old.messages.length) { old.messages = JSON.parse(JSON.stringify(sd.messages)); sd.contexts.forEach(x => { if (!old.contexts.some(y => y.href === x.href)) old.contexts.push(x); }); }
    });
    // cuộc có tin nhắn lên trước
    chats.sort((a, b) => (b.messages.length ? 1 : 0) - (a.messages.length ? 1 : 0));
  }
  // nhãn ngữ cảnh luôn tính lại từ link (dữ liệu cũ lưu nhãn "Bài đăng" / "Đơn hàng j2")
  const labelOf = x => { const m = /[?&](id|p)=([a-z0-9]+)/.exec(x.href || ""); return !m ? x.label : m[1] === "id" ? ctxOrder(m[2]).label : ctxPost(m[2]).label; };
  chats.forEach(c => c.contexts.forEach(x => x.label = labelOf(x)));
  const avatar = n => AV[n] ? `<img class="photo" src="${U(AV[n])}" alt="">` : `<span class="photo">${esc(n.charAt(0).toUpperCase())}</span>`;
  const save = () => { try { localStorage.setItem(key, JSON.stringify(chats)); } catch (e) {} };
  const context = () => {
    if (q.has("order")) { const id = q.get("order"); return /^([jo]\d+)$/.test(id) ? ctxOrder(id) : null; }
    if (q.has("post")) { const id = q.get("post"); return /^(food|goods|svc|fix|clean|trip)$/.test(id) ? ctxPost(id) : null; }
    if (q.has("job")) return { label:"Bài việc làm · " + (NAMES[q.get("job")] || "Việc làm"), href:"job.html" };
    return null;
  };
  function start(to, ctx) {
    const name = String(to || "").trim().slice(0, 80); if (!name) return null;
    let chat = chats.find(c => c.name.toLocaleLowerCase("vi-VN") === name.toLocaleLowerCase("vi-VN"));
    if (!chat) { chat = { id:"c" + Date.now(), name, contexts:[], messages:[] }; chats.unshift(chat); }
    if (ctx && !chat.contexts.some(c => c.href === ctx.href)) chat.contexts.unshift(ctx);
    save(); return chat.id;
  }
  let active = q.get("to") ? start(q.get("to"), context()) : chats[0]?.id || null;
  const activeChat = () => chats.find(c => c.id === active);
  function renderList() {
    const term = $("findChat").value.trim().toLocaleLowerCase("vi-VN");
    const list = chats.filter(c => c.name.toLocaleLowerCase("vi-VN").includes(term) || c.messages.some(m => m.text.toLocaleLowerCase("vi-VN").includes(term)));
    $("threadList").innerHTML = list.length ? list.map(c => `<button class="thread ${c.id === active ? "on" : ""}${c.unread ? " unread" : ""}" data-id="${c.id}">${avatar(c.name)}<span class="text"><b>${esc(c.name)}</b><small>${c.messages.length ? (c.messages.at(-1).from === "me" ? "Bạn: " : "") + esc(c.messages.at(-1).text) : c.contexts[0] ? esc(c.contexts[0].label) : "Chưa có tin nhắn"}</small></span><span class="when">${c.messages.length ? esc(c.messages.at(-1).time) : ""}${c.unread ? "<i></i>" : ""}</span></button>`).join("") : `<div class="empty">${term ? "Không tìm thấy cuộc trò chuyện." : "Chưa có cuộc trò chuyện nào."}</div>`;
    $("threadList").querySelectorAll("[data-id]").forEach(b => b.onclick = () => { active = b.dataset.id; const c = activeChat(); if (c && c.unread) { c.unread = 0; save(); } render(); });
  }
  function renderMain() {
    const c = activeChat();
    if (!c) { $("chatMain").innerHTML = `<div class="empty" style="margin:auto"><img src="assets/clean/peek.png" alt=""><h2>Nhắn hỏi trước khi đặt</h2><p>Mở cuộc trò chuyện từ bài đăng hoặc đơn hàng để trao đổi đúng ngữ cảnh.</p></div>`; return; }
    const latest = c.contexts[0];
    $("chatMain").innerHTML = `<div class="chat-top">${avatar(c.name)}<div><h2>${esc(c.name)}</h2><small>Hàng xóm trong khu</small></div></div>
      <div class="messages" id="messages">${c.contexts.map(x => `<a class="context-card" href="${x.href}">${icon("receipt")}<span><b>${esc(x.label)}</b><small>Nhắn tin không tự đổi trạng thái đơn</small></span>${icon("right")}</a>`).join("")}${c.messages.length ? c.messages.map(m => `<div class="bubble${m.from === "them" ? " them" : ""}">${esc(m.text)}<small>${esc(m.time)}</small></div>`).join("") : `<div class="empty" style="margin:auto">Chưa có tin nhắn. Bạn có thể hỏi trước khi đặt hoặc nhận việc.</div>`}</div>
      <form class="compose" id="sendForm"><textarea id="draft" class="input" placeholder="Viết tin nhắn cho ${esc(c.name)}" maxlength="2000" required></textarea><button class="btn primary" type="submit">${icon("right")}Gửi</button></form>`;
    $("sendForm").onsubmit = e => { e.preventDefault(); const v = $("draft").value.trim(); if (!v) return; c.messages.push({ from:"me", text:v, time:new Date().toLocaleTimeString("vi-VN", {hour:"2-digit",minute:"2-digit"}) }); chats = [c, ...chats.filter(x => x.id !== c.id)]; save(); render(); $("draft").focus(); };
    $("draft").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sendForm").requestSubmit(); } };
    $("messages").scrollTop = $("messages").scrollHeight;
  }
  function render() { const c = activeChat(); if (c && c.unread) { c.unread = 0; save(); } renderList(); renderMain(); }
  $("findChat").oninput = renderList;
  render();
})();
</script></body></html>
