<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntGo — Bán &amp; Đăng việc · Lịch</title><link rel="stylesheet" href="shared/base.css"><style>
  /* Lịch tuần kiểu Google Calendar: đơn đã xác nhận có giờ, lịch dịch vụ, việc đã chọn người.
     Cột phải: giờ nhận đơn theo thứ + ngày nghỉ (dùng chung với trang Hôm nay). */
  .ohead{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .ohead h1{font-size:30px;letter-spacing:-.02em;margin:0}.ohead p{margin:6px 0 0;color:var(--smoke)}
  .wnav{display:flex;align-items:center;gap:8px}
  .wnav .ib{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center}
  .wnav .ib:hover{background:var(--soft)}.wnav .ib svg{width:16px;height:16px}.wnav .ib.prev svg{transform:rotate(180deg)}
  .wnav .lbl{min-width:220px;height:38px;border:0;background:none;text-align:center;font-weight:700;font-size:15px;color:var(--ink);border-radius:10px}
  .wnav .lbl.back{cursor:pointer}.wnav .lbl.back:hover{background:var(--soft)}
  .legend{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--smoke)}
  .legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--ink)}
  .legend i.job{background:#3BAA6A}.legend i.svc{background:#7C6AD8}.legend i.lo{background:#DDEFE3}.legend i.lf{background:#ECEAF0}
  .cgrid{margin-top:14px;display:grid;gap:18px}
  .week{border:1px solid var(--border);border-radius:18px;background:#fff;overflow:hidden}
  .whead{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border)}
  .whead div{padding:10px 6px;text-align:center;font-size:12px;color:var(--smoke)}
  .whead b{display:block;font-size:19px;color:var(--ink);margin-top:2px}
  .whead .today b{width:34px;height:34px;margin:2px auto 0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
  .whead small{display:block;font-size:11px;margin-top:2px}
  .wbody{position:relative;height:620px;overflow-y:auto}
  .wcols{position:relative;display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
  .gut{position:relative}
  .gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--smoke)}
  .col{position:relative;border-left:1px solid var(--border)}
  .col.today{background:#FFFBF8}
  .hl{position:absolute;left:0;right:0;border-top:1px solid #F3ECE8}
  .openb{position:absolute;left:0;right:0;background:#EEF7F1}
  .offday{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#F4F3F6,#F4F3F6 8px,#EFEDF2 8px,#EFEDF2 16px);display:flex;justify-content:center;padding-top:14px}
  .offday span{height:24px;padding:0 10px;border-radius:999px;background:#fff;font-size:11.5px;font-weight:600;color:var(--smoke);display:flex;align-items:center}
  .nowl{position:absolute;left:0;right:0;border-top:2px solid #E5484D;z-index:20}
  .nowl::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#E5484D}
  /* thẻ nhỏ giống hệt trang Hôm nay */
  .ev{position:absolute;left:0;right:0;padding:0 4px}
  .mc{position:absolute;left:4px;right:6px;top:0;height:64px;display:grid;grid-template-columns:24px minmax(0,1fr);grid-template-rows:repeat(3,auto);column-gap:6px;align-content:center;padding:4px 6px 4px 5px;background:#fff;border:1px solid var(--border);border-left:3px solid var(--ink);border-radius:10px;box-shadow:0 1px 3px rgba(34,48,74,.08);z-index:calc(10 - var(--i));transform:translate(calc(var(--i) * 5px),calc(var(--i) * 5px));transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
  .mc.job{border-left-color:#3BAA6A}.mc.service{border-left-color:#7C6AD8}.mc.fin{opacity:.6}
  .mc>img{grid-row:1/4;width:24px;height:24px;border-radius:7px;object-fit:cover;align-self:center}.mc>img.av{border-radius:50%}
  .mc .n{display:flex;align-items:baseline;gap:4px;min-width:0}
  .mc .n b{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc .n time{margin-left:auto;font-size:10px;font-weight:600;color:var(--smoke);flex:none}
  .mc .l{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--smoke);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
  .mc .l svg{width:10px;height:10px;flex:none}
  .ev.deck .cnt{position:absolute;right:2px;top:-9px;z-index:15;padding:1px 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700}
  .ev.deck:hover{z-index:40}.ev.deck:hover .mc{transform:translateY(calc(var(--i) * 70px));box-shadow:0 10px 24px rgba(34,48,74,.16)}.ev.deck:hover .cnt{opacity:0}
  .stats{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stats div{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:var(--soft)}
  .stats svg{width:22px;height:22px;flex:none}.stats b{font-size:26px;letter-spacing:-.02em;line-height:1}.stats span{font-size:13px;color:var(--smoke)}
  @media(max-width:760px){.week{overflow-x:auto}.whead,.wcols{min-width:900px}}
</style></head><body><div id="siteHeader" data-space="sell" data-active="calendar"></div><main class="wrap" id="page"></main>
<script src="shared/icons.js"></script><script src="shared/common.js"></script><script src="shared/seller-data.js"></script><script>
(() => {
  const A = AntSeller, esc = AntGo.esc, icon = AntGo.icon, $ = id => document.getElementById(id), page = $("page");
  const { U, F, dateOf, toMin } = A;
  const S = A.load();
  const DAYS = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "CN"];
  const H0 = 6, H1 = 21, PX = 80, CH = 64;   // mỗi giờ một chồng thẻ (thẻ cao 64px vừa trong 1 giờ)
  let week = 0;                                   // 0 = tuần này
  const monday = () => -A.wd(0) + week * 7;      // số ngày từ hôm nay tới Thứ Hai của tuần đang xem
  const fmt = d => dateOf(d).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
  const yOf = t => (toMin(t) - H0 * 60) / 60 * PX;

  function render() {
    const m = monday(), days = Array.from({ length: 7 }, (_, i) => m + i), H = A.hours(S);
    const items = days.map(d => A.calItems(S, d));
    const all = items.flat();
    page.innerHTML = `<div class="ohead"><div><h1>Lịch</h1></div>
        <div class="wnav"><button class="ib prev" data-w="-1" aria-label="Tuần trước">${icon("right")}</button><button class="lbl${week ? " back" : ""}"${week ? ` data-w="0" title="Về tuần này"` : ""}>${fmt(m)} – ${fmt(m + 6)}</button><button class="ib" data-w="1" aria-label="Tuần sau">${icon("right")}</button></div></div>
      <div class="stats"><div>${icon("receipt")}<b>${all.filter(x => x.k !== "job").length}</b><span>đơn & lịch hẹn${week ? "" : " tuần này"}</span></div><div>${icon("hand")}<b>${all.filter(x => x.k === "job").length}</b><span>việc đã thuê${week ? "" : " tuần này"}</span></div></div>
      <div class="legend"><span><i></i>Đồ ăn & uống · Đồ dùng</span><span><i class="svc"></i>Dịch vụ</span><span><i class="job"></i>Việc làm</span><span><i class="lo"></i>Giờ nhận đơn</span><span><i class="lf"></i>Ngày nghỉ</span></div>
      <div class="cgrid"><div class="week">
          <div class="whead"><div></div>${days.map((d, i) => `<div class="${d === 0 ? "today" : ""}">${DAYS[i]}<b>${dateOf(d).getDate()}</b><small>${items[i].length ? items[i].length + " mốc" : "&nbsp;"}</small></div>`).join("")}</div>
          <div class="wbody" id="wbody"><div class="wcols" style="height:${(H1 - H0) * PX}px">
            <div class="gut">${Array.from({ length: H1 - H0 }, (_, i) => i ? `<span style="top:${i * PX}px">${H0 + i}:00</span>` : "").join("")}</div>
            ${days.map((d, i) => col(d, items[i], H[i])).join("")}
          </div></div></div>
        </div>`;
    const wb = $("wbody"); const first = all[0];
    wb.scrollTop = Math.max(0, (first ? yOf(first.tm) : yOf("09:00")) - 40);
  }
  function col(d, list, h) {
    const off = (S.offs || []).find(o => o.day === d);
    const open = A.openOf(S, d);
    let html = Array.from({ length: H1 - H0 }, (_, i) => `<div class="hl" style="top:${i * PX}px"></div>`).join("");
    if (open) html += `<div class="openb" style="top:${yOf(open.from)}px;height:${yOf(open.to) - yOf(open.from)}px"></div>`;
    if (off) html += `<div class="offday"><span>Nghỉ · ${esc(off.note || "Tạm nghỉ")}</span></div>`;
    else if (!h.on) html += `<div class="offday" style="opacity:.6"><span>Không nhận đơn</span></div>`;
    if (d === 0) { const n = new Date(), mm = n.getHours() * 60 + n.getMinutes(); if (mm >= H0 * 60 && mm <= H1 * 60) html += `<div class="nowl" style="top:${(mm - H0 * 60) / 60 * PX}px"></div>`; }
    // mốc bắt đầu khi thẻ trước còn chiếm chỗ thì vào chung chồng (rê chuột thì xòe ra), giống trang Hôm nay
    const stacks = [];
    for (const a of list) { const y = Math.max(0, yOf(a.tm)), l = stacks[stacks.length - 1]; if (l && y < l.top + CH) l.items.push(a); else stacks.push({ top: y, items: [a] }); }
    html += stacks.map(st => `<div class="ev${st.items.length > 1 ? " deck" : ""}" style="top:${st.top}px;height:${CH + (st.items.length - 1) * 5}px">
      ${st.items.length > 1 ? `<span class="cnt">${st.items.length} đơn</span>` : ""}${st.items.map((a, i) => `<a class="mc ${a.k}${a.done ? " fin" : ""}" style="--i:${i}" href="${a.href}" title="${esc(a.item)}">${a.img ? `<img src="${U(a.img, 80, 80)}" alt="">` : `<img class="av" src="${F(a.av)}" alt="">`}
        <div class="n"><b>${esc(a.who)}</b><time>${a.tm}</time></div><div class="l">${icon("pin")}${esc(a.addr)}</div><div class="l">${icon("phone")}${esc(a.phone)}</div></a>`).join("")}</div>`).join("");
    return `<div class="col${d === 0 ? " today" : ""}">${html}</div>`;
  }

  page.addEventListener("click", e => {
    const w = e.target.closest("[data-w]");
    if (w) { week = w.dataset.w === "0" ? 0 : week + +w.dataset.w; return render(); }
  });
  render();
})();
</script>
</body></html>
