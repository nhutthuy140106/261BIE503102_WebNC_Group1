<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntGo — Bán &amp; Đăng việc · Giao dịch</title><link rel="stylesheet" href="shared/base.css"><style>
  /* Giao dịch — mặt còn lại của trang Đơn hàng phía Mua: cùng mã đơn, cùng tên bước, cùng kiểu hàng .orow.
     ?id=<đơn> chi tiết đơn khách đặt · ?job=<việc> chi tiết việc bạn đăng (chọn người, xác nhận xong, hỏi đáp) */
  .ohead{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .ohead h1{font-size:30px;letter-spacing:-.02em;margin:0}.ohead p{margin:6px 0 0;color:var(--smoke)}
  .toggles{display:flex;gap:8px;flex-wrap:wrap}
  .toggles button{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
  .toggles button:hover{border-color:var(--ink)}.toggles button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .toggles button small{font-size:12px;opacity:.6}.toggles .tsep{width:1px;height:24px;background:var(--border);align-self:center;margin:0 4px}
  .toggles button svg{width:15px;height:15px}
  .ogroup{margin-top:30px}
  .ogroup h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--smoke);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .ogroup h2 svg{width:15px;height:15px}
  .needgroup{padding:18px 18px 20px;border-radius:18px;background:#FFF6F1;border:1px solid #F6DACB}
  .needgroup h2{color:var(--accent)}.needgroup .orow{border-color:#F2D5C5}
  .olist{display:grid;gap:10px}
  .orow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--card);text-align:left;width:100%;transition:background .15s}
  .orow:hover{background:var(--soft)}
  .orow .th{width:92px;height:76px;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;text-align:center}
  .orow .th img{width:100%;height:100%;object-fit:cover}.orow .th svg{width:26px;height:26px}
  .orow .th small{display:block;margin-top:2px;font-size:11px;font-weight:600;color:var(--smoke)}
  .otag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;border:1px solid var(--border);color:var(--smoke)}
  .otag.job{border-color:var(--ink);color:var(--ink)}
  .orow h3{margin:6px 0 0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .orow .sub{margin-top:3px;color:var(--smoke);font-size:13px}
  .orow .end{text-align:right;display:grid;gap:8px;justify-items:end}.orow .end b{font-size:16px}
  .orow.ended{opacity:.72}
  .stat{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
  .stat::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  .stat.act{color:var(--accent)}.stat.wait{color:#A86A12}.stat.go{color:#2E7D4F}.stat.done{color:var(--smoke)}.stat.off{color:var(--fog)}
  .histlink{margin-top:26px;width:100%;display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;border:1px dashed var(--border);background:#fff;text-align:left;color:var(--smoke)}
  .histlink:hover{background:var(--soft)}.histlink>svg{width:20px;height:20px}.histlink>svg:last-child{margin-left:auto;width:16px;height:16px}
  .histlink b{display:block;color:var(--ink);font-size:15px}
  .empty2{padding:50px 0;text-align:center;color:var(--smoke)}.empty2 img{width:110px;display:block;margin:0 auto 12px}

  /* chi tiết */
  .crumb{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:13px;font-weight:600}
  .crumb svg{width:16px;height:16px;transform:rotate(180deg)}
  .dhead{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:24px 28px;border-radius:22px;background:var(--soft)}
  .dhead .chips{display:flex;gap:8px;flex-wrap:wrap}
  .dhead .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#fff;font-size:12.5px;font-weight:600}
  .dhead .chip svg{width:14px;height:14px}
  .dhead h1{margin:12px 0 0;font-size:26px;letter-spacing:-.02em;line-height:1.25}
  .dhead .who{margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--smoke);font-size:13.5px}
  .dhead .who img{width:26px;height:26px;border-radius:50%;object-fit:cover}.dhead .who b{color:var(--ink)}
  .dhead .amt{text-align:right}.dhead .amt small{display:block;font-size:12.5px;color:var(--smoke)}.dhead .amt b{font-size:28px;letter-spacing:-.02em}
  .steps{margin-top:22px;display:flex;align-items:flex-start}
  .stp{flex:1;position:relative;text-align:center;font-size:12.5px;color:var(--fog)}
  .stp::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--border)}
  .stp:first-child::before{display:none}
  .stp i{position:relative;z-index:1;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--border);background:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
  .stp.ok{color:var(--ink)}.stp.ok::before,.stp.now::before{background:var(--ink)}
  .stp.ok i{background:var(--ink);border-color:var(--ink);color:#fff}.stp.ok i svg{width:14px;height:14px}
  .stp.now{color:var(--ink);font-weight:700}.stp.now i{border-color:var(--accent);color:var(--accent)}
  .stp small{display:block;font-size:11.5px;color:var(--smoke);font-weight:400;margin-top:2px}
  .stp.cut i{border-color:var(--fog);color:var(--fog)}
  .dgrid{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
  .box{border:1px solid var(--border);border-radius:18px;padding:20px 22px;background:#fff}
  .box+.box{margin-top:18px}
  .box h2{margin:0 0 12px;font-size:16px}
  .info{display:grid}
  .info>div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:14px}
  .info>div:first-child{border-top:0;padding-top:2px}
  .info dt{display:flex;align-items:center;gap:7px;color:var(--smoke)}.info dt svg{width:16px;height:16px}
  .info dd{margin:0}.info dd small{display:block;color:var(--smoke);font-size:12.5px;margin-top:2px}
  .lines{display:grid;gap:8px;font-size:14px}
  .lines div{display:flex;justify-content:space-between;gap:12px}.lines span{color:var(--smoke)}
  .lines .tot{padding-top:10px;border-top:1px solid var(--border);font-weight:700;font-size:16px}.lines .tot span{color:var(--ink)}
  .note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
  .side{position:sticky;top:84px;display:grid;gap:16px}
  .panel{border:1px solid var(--border);border-radius:18px;padding:20px;background:#fff}
  .panel .now{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
  .panel p{margin:8px 0 14px;color:var(--smoke);font-size:13.5px;line-height:1.5}
  .panel .btn{width:100%;height:44px}.panel .btn+.btn{margin-top:8px}
  .panel .warn{padding:12px 14px;border-radius:12px;background:#FFF6F1;border:1px solid #F6DACB;font-size:13.5px;margin-bottom:12px}
  .panel .warn b{display:block;color:var(--accent);margin-bottom:2px}
  .person{display:flex;align-items:center;gap:12px}
  .person img{width:46px;height:46px;border-radius:50%;object-fit:cover}
  .person b{display:block}.person small{color:var(--smoke);font-size:12.5px}
  .person+.prow{margin-top:14px}
  .prow{display:flex;gap:8px}.prow .btn{flex:1;height:40px}
  .reportlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--smoke)}.reportlink:hover{color:var(--ink)}
  .reportlink svg{width:15px;height:15px}
  .form{display:grid;gap:10px;margin-top:4px}
  .form label.rd{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;cursor:pointer}
  .form label.rd:has(input:checked){border-color:var(--ink);background:var(--soft)}
  .form input[type=radio]{accent-color:var(--ink)}
  .form .row2{display:flex;gap:8px}.form .row2 .btn{flex:1;height:40px}
  .form textarea{min-height:70px;resize:vertical}
  .rev{display:flex;gap:12px}.rev img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  .rev .st{color:#E39B1A;letter-spacing:1px;font-size:13px}.rev p{margin:4px 0 0}
  .rev .rep{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13.5px}.rev .rep b{display:block;font-size:12.5px;margin-bottom:2px}
  /* việc: người đề nghị */
  .offer{display:grid;grid-template-columns:52px minmax(0,1fr) 170px;gap:14px;padding:16px 0;border-top:1px solid var(--border);align-items:start}
  .offer:first-of-type{border-top:0;padding-top:4px}
  .offer>img{width:52px;height:52px;border-radius:50%;object-fit:cover}
  .offer b{font-size:15px}.offer .m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--smoke);margin-top:3px}
  .offer .m span{display:inline-flex;align-items:center;gap:4px}.offer .m svg{width:13px;height:13px}.offer .m .gold{color:#E39B1A}
  .offer p{margin:8px 0 0;font-size:14px;color:#3C4660}
  .offer .acts{display:grid;gap:6px}.offer .acts .btn{height:38px;font-size:13px}
  .offer .acts .stat{justify-self:end}
  .offer.out{opacity:.55}
  .reportbox{margin-top:10px;padding:12px 14px;border-radius:12px;background:#F1F8F3;font-size:13.5px}
  .reportbox b{display:block;color:#2E7D4F;margin-bottom:4px}
  .photos{display:flex;gap:6px;margin-top:8px}.photos span{width:56px;height:56px;border-radius:8px;background:#DCEFE2;display:grid;place-items:center;color:#2E7D4F}.photos svg{width:18px;height:18px}
  .stars{display:flex;gap:2px}.stars button{border:0;background:none;font-size:24px;color:#E5DED6;padding:0 2px;line-height:1}.stars button.on{color:#E39B1A}
  .qa{display:grid;gap:12px}
  .q{padding:14px;border:1px solid var(--border);border-radius:14px}
  .q .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--smoke)}.q .h img{width:24px;height:24px;border-radius:50%;object-fit:cover}.q .h b{color:var(--ink)}
  .q>p{margin:8px 0 0;font-size:14.5px}
  .q .a{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}.q .a b{display:block;font-size:12.5px;margin-bottom:2px}
  .q form{margin-top:10px;display:flex;gap:8px}.q form input{flex:1}
  .demo-note a{text-decoration:underline}
  @media(max-width:1000px){.dgrid{grid-template-columns:1fr}.side{position:static}.dhead{grid-template-columns:1fr}.dhead .amt{text-align:left}}
  @media(max-width:700px){.orow{grid-template-columns:64px minmax(0,1fr)}.orow .th{width:64px;height:56px}.orow .end{grid-column:1/-1;justify-items:start;text-align:left}.info>div{grid-template-columns:1fr}.offer{grid-template-columns:44px minmax(0,1fr)}.offer .acts{grid-column:1/-1}.steps{overflow-x:auto}}
</style></head><body><div id="siteHeader" data-space="sell" data-active="sorders"></div><main class="wrap" id="page"></main>
<script src="shared/icons.js"></script><script src="shared/common.js"></script><script src="shared/seller-data.js"></script><script>
(() => {
  const A = AntSeller, esc = AntGo.esc, icon = AntGo.icon, $ = id => document.getElementById(id), page = $("page");
  const { U, F, money, KIND, dayLabel } = A;
  const S = A.load();
  const qs = new URLSearchParams(location.search);
  const svgCheck = icon("check");
  const whenTxt = o => `${o.ful === "pickup" ? "Tự lấy" : o.ful === "home" ? "Làm tại nhà" : "Giao"} ${o.tm} · ${dayLabel(o.day).toLowerCase()}`;

  /* ================= DANH SÁCH ================= */
  function list() {
    const f = qs.get("f") || "";
    const os = A.orders(S), js = A.jobs(S);
    const rowsO = os.map(o => ({ t: "o", o, end: o.ended, need: o.need }));
    const rowsJ = js.map(j => ({ t: "j", j, end: !!j.closed, need: j.need }));
    const hist = f === "hist";
    const all = rowsO.concat(rowsJ).filter(x => hist ? x.end : !x.end).filter(x => !f || hist || (f === "placed") === (x.t === "o"));
    const need = all.filter(x => x.need && !x.end), act = all.filter(x => !x.need && !x.end), old = all.filter(x => x.end);
    const nO = rowsO.filter(x => !x.end).length, nJ = rowsJ.filter(x => !x.end).length, nH = rowsO.concat(rowsJ).filter(x => x.end).length;
    const row = x => x.t === "o"
      ? `<a class="orow${x.end ? " ended" : ""}" href="?id=${x.o.id}"><span class="th">${x.o.img ? `<img src="${U(x.o.img)}" alt="">` : `<span>${icon(x.o.ic)}<small>${KIND[x.o.k][1]}</small></span>`}</span>
          <span><span class="otag">Đơn khách đặt</span><h3>${esc(x.o.title)}</h3><div class="sub">${esc(x.o.buyer.n)} · ${whenTxt(x.o)} · ${x.o.code}</div></span>
          <span class="end"><b>${money(x.o.total)}</b><span class="stat ${x.o.cls}">${x.o.cancelReq ? "Khách xin hủy" : x.o.label}</span></span></a>`
      : `<a class="orow${x.end ? " ended" : ""}" href="?job=${x.j.id}"><span class="th"><span>${icon("hand")}<small>${x.j.cat}</small></span></span>
          <span><span class="otag job">Việc bạn đăng</span><h3>${esc(x.j.title)}</h3><div class="sub">${x.j.when} · ${x.j.offers.length} người đề nghị · ${x.j.code}</div></span>
          <span class="end"><b>${money(x.j.pay)}</b><span class="stat ${x.j.cls}">${x.j.need && x.j.offers.some(o => o.st === "reported") ? "Đã báo xong" : x.j.questions.some(q => !q.answer) && !x.j.waiting.length ? "Có câu hỏi mới" : x.j.label}</span></span></a>`;
    page.innerHTML = `
      <div class="ohead"><div><h1>Giao dịch</h1><p>Đơn khách đặt từ bài của bạn và những việc bạn đăng cần người.</p></div>
        <div class="toggles"><button data-f="" class="${!f ? "on" : ""}">Tất cả <small>${nO + nJ}</small></button><button data-f="placed" class="${f === "placed" ? "on" : ""}">Đơn khách đặt <small>${nO}</small></button><button data-f="jobs" class="${f === "jobs" ? "on" : ""}">Việc bạn đăng <small>${nJ}</small></button><span class="tsep"></span><button data-f="hist" class="${hist ? "on" : ""}">${icon("clock")}Lịch sử <small>${nH}</small></button></div></div>
      ${hist ? `<section class="ogroup"><h2>Lịch sử · ${old.length}</h2><div class="olist">${old.map(row).join("")}</div></section>` : ""}
      ${!hist && need.length ? `<section class="ogroup needgroup"><h2>${icon("bolt")}Cần bạn xử lý · ${need.length}</h2><div class="olist">${need.map(row).join("")}</div></section>` : ""}
      ${!hist && act.length ? `<section class="ogroup"><h2>Đang diễn ra · ${act.length}</h2><div class="olist">${act.map(row).join("")}</div></section>` : ""}
      ${!hist ? `<button class="histlink" data-f="hist">${icon("clock")}<span><b>Lịch sử giao dịch</b>${nH} đơn và việc đã kết thúc</span>${icon("right")}</button>` : ""}
      ${!(hist ? old : need.concat(act)).length ? `<div class="empty2"><img src="assets/clean/peek.png" alt="">Không có giao dịch nào ở đây.</div>` : ""}
      <p class="demo-note">Bản mẫu · tài khoản Bếp Cô Lan · <a href="#" data-reset>Đặt lại dữ liệu mẫu</a></p>`;
  }

  /* ================= CHI TIẾT ĐƠN ================= */
  function steps(arr, cur, hist, cut) {
    const idx = arr.findIndex(s => s[0] === cur);
    const at = st => { const h = hist.filter(x => x[0] === st).pop(); return h ? h[1] : ""; };
    return `<div class="steps">${arr.map(([st, lb], i) => {
      const cls = cut ? (i < (cut.at) ? "ok" : i === cut.at ? "cut" : "") : i < idx ? "ok" : i === idx ? (st === "done" ? "ok" : "now") : "";
      return `<div class="stp ${cls}"><i>${cls === "ok" ? svgCheck : cls === "cut" ? "✕" : i + 1}</i>${cut && i === cut.at ? cut.label : lb}${at(st) || (cut && i === cut.at) ? `<small>${cut && i === cut.at ? cut.time : at(st)}</small>` : ""}</div>`;
    }).join("")}</div>`;
  }
  const GUIDE = {
    waiting: "Khách đang chờ bạn xác nhận. Đơn không được xác nhận trước hạn sẽ tự hủy để khách đặt nơi khác.",
    confirmed: "Bạn đã nhận đơn. Bấm bắt đầu khi bắt tay vào chuẩn bị để khách theo dõi được.",
    preparing: "Đơn đang được chuẩn bị. Xong thì báo giao hoặc báo khách đến lấy.",
    delivering: "Đơn đang trên đường tới khách. Thu tiền mặt khi giao (nếu khách trả tiền mặt).",
    ready: "Khách được báo đến lấy tại bếp. Bấm khi khách đã nhận.",
    done: "Đơn đã hoàn thành. Tiền khách trả trực tiếp cho bạn; AntGo không giữ tiền.",
    declined: "Bạn đã từ chối đơn này. Khách đã được báo.", cancelled: "Đơn đã hủy theo yêu cầu của khách.",
  };
  function orderDetail(id) {
    const o = A.orders(S).find(x => x.id === id);
    if (!o) return notFound();
    const svc = o.ful === "home", flow = A.STEPS[o.ful];
    const cut = o.state === "declined" ? { at: 1, label: "Đã từ chối", time: (o.hist.find(h => h[0] === "declined") || [])[1] || "" }
      : o.state === "cancelled" ? { at: Math.max(1, o.hist.filter(h => flow.some(s => s[0] === h[0])).length), label: "Đã hủy", time: (o.hist.find(h => h[0] === "cancelled") || [])[1] || "" } : null;
    const rv = o.review ? A.reviews(S).find(r => r.id === o.review) : null;
    const acts = A.orderActions(o);
    const items = o.items.map(([n, q, opt, p]) => `<div><span>${esc(n)} × ${q}${opt ? ` · ${esc(opt)}` : ""}</span><b>${money(q * p)}</b></div>`).join("");
    page.innerHTML = `<a class="crumb" href="seller-orders.html">${icon("right")}Giao dịch</a>
      <div class="dhead"><div><div class="chips"><span class="chip">${icon(KIND[o.k][0])}${KIND[o.k][1]}</span><span class="chip">Đơn khách đặt</span><span class="chip">${o.code}</span></div>
        <h1>${esc(o.title)}</h1><div class="who"><img src="${F(o.buyer.av)}" alt=""><b>${esc(o.buyer.n)}</b> · ${whenTxt(o)}</div></div>
        <div class="amt"><small>Tổng tiền · ${o.pay === "cash" ? "Tiền mặt" : "Chuyển khoản"}</small><b>${money(o.total)}</b></div></div>
      ${steps(flow, o.state, o.hist, cut)}
      <div class="dgrid"><div>
        <div class="box"><h2>Thông tin đơn</h2><dl class="info">
          <div><dt>${icon("user")}Khách</dt><dd>${esc(o.buyer.n)}<small>${o.buyer.phone}</small></dd></div>
          <div><dt>${icon("pin")}${svc ? "Làm tại" : "Nhận hàng"}</dt><dd>${o.ful === "pickup" ? "Khách tự đến lấy" : svc ? "Tại nhà khách" : "Giao tận cửa"}<small>${esc(o.addr)}</small></dd></div>
          <div><dt>${icon("clock")}Thời gian</dt><dd>${o.tm} · ${dayLabel(o.day)}${o.dur ? `<small>Khoảng ${o.dur / 60} giờ</small>` : ""}</dd></div>
          <div><dt>${icon("bag")}${svc ? "Dịch vụ" : "Món"}</dt><dd>${o.items.map(([n, q, opt]) => `${esc(n)} × ${q}${opt ? `<small>${esc(opt)}</small>` : ""}`).join("<br>")}</dd></div>
          ${(o.answers || []).map(([q, a]) => `<div><dt>${icon("question")}${esc(q)}</dt><dd>${esc(a)}</dd></div>`).join("")}
          ${o.note ? `<div><dt>${icon("pencil")}Ghi chú</dt><dd>${esc(o.note)}</dd></div>` : ""}
          ${o.declineReason && o.state === "declined" ? `<div><dt>${icon("xmark")}Lý do từ chối</dt><dd>${esc(o.declineReason)}</dd></div>` : ""}
        </dl></div>
        <div class="box"><h2>Chi tiết thanh toán</h2><div class="lines">${items}
          ${o.ship ? `<div><span>Phí giao</span><b>${money(o.ship)}</b></div>` : ""}
          ${o.surcharge ? `<div><span>Phụ thu · ${esc(o.surcharge.reason)}</span><b>${money(o.surcharge.amount)}${o.surcharge.ok ? "" : " · chờ khách"}</b></div>` : ""}
          <div class="tot"><span>Tổng cộng</span><b>${money(o.total)}</b></div></div></div>
        ${rv ? `<div class="box" id="review"><h2>Đánh giá của khách</h2><div class="rev"><img src="${F(rv.by.av)}" alt=""><div style="flex:1"><b>${esc(rv.by.n)}</b> <span class="muted small">· ${rv.at}</span>
          <div class="st">${"★".repeat(rv.stars)}${"☆".repeat(5 - rv.stars)}</div><p>${esc(rv.text)}</p>
          ${rv.reply ? `<div class="rep"><b>Bạn đã phản hồi</b>${esc(rv.reply)}</div>` : `<form class="form" data-review="${rv.id}"><textarea class="input" placeholder="Phản hồi khách (hiện công khai dưới đánh giá)" required maxlength="300"></textarea><div class="row2"><button class="btn dark">Gửi phản hồi</button></div></form>`}</div></div></div>` : ""}
      </div>
      <aside class="side">
        <div class="panel"><div class="now"><span class="stat ${o.cls}">${o.cancelReq ? "Khách xin hủy" : o.label}</span></div>
          ${o.cancelReq ? `<div class="warn" style="margin-top:12px"><b>Khách xin hủy đơn</b>“${esc(o.cancelReq)}”</div>` : `<p>${GUIDE[o.state]}${o.state === "waiting" && o.due ? ` <b style="color:var(--accent)">${o.due}.</b>` : ""}</p>`}
          <div id="actBox">${acts.map(([a, t, p]) => `<button class="btn${p ? " primary" : ""}" data-oact="${a}">${t}</button>`).join("")}</div></div>
        <div class="panel"><div class="person"><img src="${F(o.buyer.av)}" alt=""><div><b>${esc(o.buyer.n)}</b><small>Khách · ${o.buyer.phone}</small></div></div>
          <div class="prow"><a class="btn" href="seller-messenger.html?to=${encodeURIComponent(o.buyer.n)}&order=${o.id}">${icon("chat")}Nhắn</a><a class="btn" href="tel:${o.buyer.phone.replace(/\s/g, "")}">${icon("phone")}Gọi</a></div></div>
        <a class="reportlink" href="support.html?order=${o.id}">${icon("shield")}Báo cáo vấn đề với đơn này</a>
      </aside></div>`;
    page.querySelectorAll("[data-oact]").forEach(b => b.onclick = () => {
      const a = b.dataset.oact;
      if (a === "decline") return reasonForm("Lý do từ chối", ["Hết món / hết hàng", "Không kịp giờ khách hẹn", "Ngoài khu vực giao", "Khác"], r => run(o.id, "decline", { reason: r }));
      if (a === "surcharge") return surchargeForm(o.id);
      run(o.id, a);
    });
    const rf = page.querySelector("[data-review]");
    if (rf) rf.onsubmit = e => { e.preventDefault(); A.reply(S, rf.dataset.review, rf.querySelector("textarea").value.trim()); AntGo.toast("Đã gửi phản hồi — hiện dưới đánh giá ở trang bài"); render(); };
  }
  function run(id, a, data) { const msg = A.orderAct(S, id, a, data); AntGo.toast(msg); render(); }
  function reasonForm(title, opts, done) {
    $("actBox").innerHTML = `<form class="form"><b style="font-size:14px">${title}</b>${opts.map((o, i) => `<label class="rd"><input type="radio" name="rs" value="${esc(o)}"${i ? "" : " checked"}>${esc(o)}</label>`).join("")}
      <div class="row2"><button type="button" class="btn" data-cancel>Thôi</button><button class="btn primary">Từ chối đơn</button></div></form>`;
    const f = $("actBox").querySelector("form");
    f.onsubmit = e => { e.preventDefault(); done(f.querySelector("input:checked").value); };
    f.querySelector("[data-cancel]").onclick = render;
  }
  function surchargeForm(id) {
    $("actBox").innerHTML = `<form class="form"><b style="font-size:14px">Báo phụ thu</b><p class="muted small" style="margin:0">Khách đồng ý thì phụ thu mới cộng vào đơn.</p>
      <input class="input" type="number" min="1000" step="1000" placeholder="Số tiền, ví dụ 50000" required><input class="input" placeholder="Lý do, ví dụ: thêm 2 món" required maxlength="80">
      <div class="row2"><button type="button" class="btn" data-cancel>Thôi</button><button class="btn primary">Gửi khách</button></div></form>`;
    const f = $("actBox").querySelector("form");
    f.onsubmit = e => { e.preventDefault(); const [amt, rs] = f.querySelectorAll("input"); run(id, "surcharge", { amount: +amt.value, reason: rs.value.trim() }); };
    f.querySelector("[data-cancel]").onclick = render;
  }

  /* ================= CHI TIẾT VIỆC ================= */
  const hasPhone = t => /\d{9,}/.test(t.replace(/[\s.\-()_,]/g, ""));
  function jobDetail(id) {
    const j = A.jobs(S).find(x => x.id === id);
    if (!j) return notFound();
    const active = j.offers.find(o => ["chosen", "working", "reported", "done"].includes(o.st));
    const flow = [["open", "Nhận đề nghị"], ["chosen", "Đã chọn người"], ["reported", "Đã báo xong"], ["done", "Hoàn thành"]];
    const cur = !active ? "open" : active.st === "working" ? "chosen" : active.st;
    const offerRow = o => {
      const st = o.st, out = ["rejected", "withdrawn", "cancelled"].includes(st);
      let acts = "";
      if (st === "offered") acts = j.closed ? "" : `<button class="btn dark" data-ofr="choose" data-id="${o.id}">Chọn người này</button><button class="btn" data-ofr="reject" data-id="${o.id}">Từ chối</button>`;
      if (st === "reported") acts = `<button class="btn primary" data-ofr="confirmDone" data-id="${o.id}">Xác nhận hoàn thành</button>`;
      if (st === "done" && !o.rated) acts = `<button class="btn dark" data-rate="${o.id}">Đánh giá người làm</button>`;
      if (["chosen", "working", "reported", "done"].includes(st)) acts += `<a class="btn" href="seller-messenger.html?to=${encodeURIComponent(o.who.n)}&job=${j.id}">${icon("chat")}Nhắn</a>`;
      return `<div class="offer${out ? " out" : ""}"><img src="${F(o.who.av)}" alt=""><div><b>${esc(o.who.n)}</b>
          <div class="m"><span><b class="gold">★</b>${o.who.rate}</span><span>${icon("check")}${o.who.jobs} việc đã làm</span><span>${icon("pin")}${o.who.dist}</span><span>${icon("clock")}${esc(o.slot)}</span></div>
          <p>“${esc(o.intro)}”</p>
          ${o.report && st === "reported" ? `<div class="reportbox"><b>Đã báo hoàn thành lúc ${o.report.at}</b>${esc(o.report.note)}<div class="photos">${("<span>" + icon("camera") + "</span>").repeat(o.report.photos)}</div><small class="muted">Không phản hồi trong 24 giờ, việc tự hoàn thành.</small></div>` : ""}
          ${o.rated ? `<div class="reportbox" style="background:var(--soft)"><b style="color:var(--ink)">Bạn đã đánh giá ${"★".repeat(o.rated.stars)}</b>${esc(o.rated.text || "")}</div>` : ""}
          <div id="rate-${o.id}"></div></div>
        <div class="acts"><span class="stat ${st === "offered" ? "wait" : out ? "off" : st === "done" ? "done" : st === "reported" ? "act" : "go"}">${o.label}</span>${acts}</div></div>`;
    };
    page.innerHTML = `<a class="crumb" href="seller-orders.html?f=jobs">${icon("right")}Giao dịch</a>
      <div class="dhead"><div><div class="chips"><span class="chip">${icon("hand")}Việc làm</span><span class="chip">${j.cat}</span><span class="chip">${j.code}</span></div>
        <h1>${esc(j.title)}</h1><div class="who">${j.when} · ${j.area} · cần ${j.head} người</div></div>
        <div class="amt"><small>Tiền công · trả trực tiếp</small><b>${money(j.pay)}<span style="font-size:14px;font-weight:500;color:var(--smoke)"> ${j.unit}</span></b></div></div>
      ${steps(flow, cur, active && active.report ? [["reported", active.report.at]] : [], null)}
      <div class="dgrid"><div>
        <div class="box"><h2>Người đề nghị · ${j.offers.length}</h2>${j.offers.map(offerRow).join("")}</div>
        <div class="box"><h2>Thông tin việc</h2><dl class="info">
          <div><dt>${icon("clock")}Thời gian</dt><dd>${j.when}</dd></div>
          <div><dt>${icon("pin")}Địa điểm</dt><dd>${j.area}<small>${esc(j.exact)} — chỉ người được chọn mới thấy</small></dd></div>
          <div><dt>${icon("users")}Số người cần</dt><dd>${j.head} người</dd></div>
          <div><dt>${icon("pencil")}Việc cần làm</dt><dd>${esc(j.desc)}</dd></div>
          ${j.reqs.length ? `<div><dt>${icon("check")}Yêu cầu</dt><dd>${j.reqs.map(esc).join("<br>")}</dd></div>` : ""}
        </dl></div>
        <div class="box" id="qa"><h2>Hỏi đáp công khai · ${j.questions.length}</h2>${j.questions.length ? `<div class="qa">${j.questions.map(q => `<div class="q"><div class="h"><img src="${F(q.by.av)}" alt=""><b>${esc(q.by.n)}</b> · ${q.at}</div><p>${esc(q.text)}</p>
          ${q.answer ? `<div class="a"><b>Bạn trả lời</b>${esc(q.answer)}</div>` : `<form data-q="${q.id}"><input class="input" placeholder="Trả lời công khai, không ghi số điện thoại…" required maxlength="300"><button class="btn dark">Trả lời</button></form>`}</div>`).join("")}</div>`
          : `<p class="muted" style="margin:0">Chưa có câu hỏi nào.</p>`}</div>
      </div>
      <aside class="side">
        <div class="panel"><div class="now"><span class="stat ${j.cls}">${j.label}</span></div>
          <p>${!active ? (j.closed ? "Việc đã đóng, không nhận thêm đề nghị." : "So sánh người đề nghị rồi chọn một người. Gửi đề nghị chưa phải là đã nhận việc.") :
            active.st === "reported" ? `${esc(active.who.n)} đã báo xong. Kiểm tra rồi xác nhận để hoàn thành việc.` :
            active.st === "done" ? `Việc đã hoàn thành. Nhớ trả ${money(j.pay)} trực tiếp cho ${esc(active.who.n)} và đánh giá người làm.` :
            `Bạn đã chọn ${esc(active.who.n)}. Địa chỉ chính xác đã gửi cho người làm.`}</p>
          ${!j.closed ? `<button class="btn" data-job="close">${icon("pause")}Đóng nhận đề nghị</button>` : !active || active.st !== "done" ? `<button class="btn" data-job="open">${icon("play")}Mở lại việc</button>` : ""}
          ${j.post ? `<a class="btn" href="seller-post-form.html?type=job&id=${j.post}">${icon("pencil")}Sửa việc</a>` : ""}
          ${!j.closed && !active ? `<button class="btn" data-job="pin"><img src="assets/clean/antxu.png?v=2" alt="" style="width:16px">Ghim đầu danh sách · 20 Xu</button>` : ""}</div>
        <a class="reportlink" href="support.html?order=${j.id}">${icon("shield")}Báo cáo vấn đề với việc này</a>
      </aside></div>`;
    page.querySelectorAll("[data-ofr]").forEach(b => b.onclick = () => { AntGo.toast(A.offerAct(S, j.id, b.dataset.id, b.dataset.ofr)); render(); });
    page.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rateForm(j.id, b.dataset.rate));
    page.querySelectorAll("form[data-q]").forEach(f => f.onsubmit = e => {
      e.preventDefault(); const v = f.querySelector("input").value.trim();
      if (hasPhone(v)) return AntGo.toast("Không ghi số điện thoại ở hỏi đáp công khai — hãy nhắn riêng");
      A.answer(S, f.dataset.q, v); AntGo.toast("Đã trả lời — câu trả lời hiện cho mọi người xem việc"); render();
    });
    page.querySelectorAll("[data-job]").forEach(b => b.onclick = () => {
      const a = b.dataset.job;
      if (a === "pin") { if (S.xu < 20) return AntGo.toast(`Cần 20 Xu, bạn còn ${S.xu} Xu`); S.xu -= 20; A.save(S); syncXu(); return AntGo.toast("Đã ghim việc lên đầu danh sách 3 ngày · trừ 20 Xu"); }
      A.setJob(S, j.id, { closed: a === "close" }); AntGo.toast(a === "close" ? "Đã đóng — việc không nhận thêm đề nghị" : "Đã mở lại việc"); render();
    });
    if (location.hash === "#qa") setTimeout(() => $("qa").scrollIntoView({ block: "start" }), 0);
  }
  function rateForm(jobId, offerId) {
    const box = $("rate-" + offerId); let stars = 5;
    box.innerHTML = `<form class="form" style="margin-top:10px"><div class="stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-s="${n}" class="on">★</button>`).join("")}</div>
      <textarea class="input" placeholder="Nhận xét (không bắt buộc)" maxlength="300"></textarea><div class="row2"><button type="button" class="btn" data-cancel>Thôi</button><button class="btn dark">Gửi đánh giá</button></div></form>`;
    const f = box.querySelector("form");
    f.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { stars = +b.dataset.s; f.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", +x.dataset.s <= stars)); });
    f.querySelector("[data-cancel]").onclick = render;
    f.onsubmit = e => { e.preventDefault(); AntGo.toast(A.offerAct(S, jobId, offerId, "rate", { stars, text: f.querySelector("textarea").value.trim() })); render(); };
  }

  function notFound() { page.innerHTML = `<div class="empty2" style="padding-top:90px"><img src="assets/clean/peek.png" alt="">Không tìm thấy giao dịch này.<br><a class="btn" style="margin-top:14px" href="seller-orders.html">Về Giao dịch</a></div>`; }
  function syncXu() { document.querySelectorAll(".appbar .xubtn").forEach(x => x.lastChild.textContent = `${S.xu} Xu`); }
  function render() { qs.get("id") ? orderDetail(qs.get("id")) : qs.get("job") ? jobDetail(qs.get("job")) : list(); syncXu(); }

  document.addEventListener("click", e => {
    const f = e.target.closest("[data-f]");
    if (f) { const u = new URL(location.href); u.search = f.dataset.f ? "?f=" + f.dataset.f : ""; history.replaceState(null, "", u); qs.delete("f"); if (f.dataset.f) qs.set("f", f.dataset.f); list(); return; }
    if (e.target.closest("[data-reset]")) { e.preventDefault(); localStorage.removeItem(A.KEY); location.reload(); }
  });
  render();
})();
</script>
</body></html>
