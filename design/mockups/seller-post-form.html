    if (key === "imgs") return T !== "job" && !Fm.imgs.length;
    if (key === "price") return T === "service" ? Fm.price.type !== "quote" && !(+Fm.price.amount > 0) : (T === "food" || T === "goods") && !(+Fm.price > 0);
    if (key === "pay") return T === "job" && !(+Fm.pay > 0);
    if (key === "date") return T === "job" && !Fm.repeat && !Fm.date;
    if (key === "exact") return T === "job" && Fm.exact.trim().length < 3;

  }
  const KEYS = ["imgs", "t", "desc", "price", "pay", "date", "exact"];

  function view() {

  /* ===== sự kiện ===== */
  const coerce = el => el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? "" : +el.value) : el.value;

      const cur = get(d.set); set(d.set, typeof cur === "number" ? +d.val : d.val); return render();
    }
    if (d.svc) { const keep = { t: Fm.t, desc: Fm.desc, imgs: Fm.imgs, area: Fm.area, notes: Fm.notes }; Fm = Object.assign(template("service", d.svc), keep); dirty = true; AntGo.toast(`Đã điền sẵn theo mẫu “${d.svc}” — sửa lại cho đúng cách bạn làm`); return render(); }
    if (d.flip) { set(d.flip, !get(d.flip)); return render(); }
    if (d.day) { const arr = get(d.day) || [], i = +d.i; set(d.day, arr.includes(i) ? arr.filter(x => x !== i) : arr.concat(i).sort()); return render(); }
    if (d.rmimg != null) { Fm.imgs.splice(+d.rmimg, 1); dirty = true; return render(); }
    if (d.addrow) { get(d.addrow).push(""); dirty = true; return render(); }
    if (d.rmrow) { const arr = get(d.rmrow); arr.splice(+d.i, 1); if (!arr.length && ["notes", "reqs"].includes(d.rmrow)) arr.push(""); dirty = true; return render(); }
    if (d.addgroup) { get(d.addgroup).push({ name: "", req: false, items: [{ n: "", p: 0 }] }); dirty = true; return render(); }
    if (d.additem) { get(d.additem).push({ n: "", p: 0 }); dirty = true; return render(); }
    if (d.gm) { get(d.gm).multi = d.v === "1"; dirty = true; return render(); }
    if (d.addq != null) { Fm.qs.push({ type: "text", label: "", opts: "", req: false, hint: "" }); dirty = true; return render(); }
    if (d.publish != null || d.draft != null) return submit(d.draft != null);
  });
  // ảnh: thu nhỏ còn 480px để lưu được trong trình duyệt; chỉ nhận png/jpg/webp ≤ 2 MB
  $("file").addEventListener("change", e => {
    const max = Fm.type === "job" ? 3 : 6, files = [...e.target.files].slice(0, max - Fm.imgs.length); e.target.value = "";
    files.forEach(f => {
      if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return AntGo.toast(`“${f.name}” không phải ảnh PNG/JPG/WebP`);
      if (f.size > 2 * 1024 * 1024) return AntGo.toast(`“${f.name}” lớn hơn 2 MB`);
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 480 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); Fm.imgs.push(c.toDataURL("image/jpeg", .8)); dirty = true; render(); }; img.src = r.result; };
      r.readAsDataURL(f);
    });
  });

  function submit(draft) {
    tried = true;
    const bad = KEYS.filter(invalid);
    if (bad.length && !draft) { render(); markErrors(); const el = document.querySelector(".fld.bad"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); return AntGo.toast("Còn mục chưa điền đúng — xem chỗ viền đỏ"); }
    const T = Fm.type, v = view();
    const price = T === "service" ? +Fm.price.amount || 0 : T === "job" ? +Fm.pay || 0 : +Fm.price || 0;
    const unit = v.unit ? "/ " + v.unit : "";
    const cat = T === "service" ? Fm.kind : Fm.cat;
    const val = T === "food" ? +Fm.perDay || 20 : T === "goods" ? +Fm.stock || 1 : T === "service" ? 3 : +Fm.head || 1;
    const form = clone(Fm);
    if (existing) {
      A.setPost(S, existing.id, { t: Fm.t.trim(), price, unit, cat, desc: Fm.desc, img: Fm.imgs[0] || existing.img, form });
      if (T === "job" && existing.job) A.setJob(S, existing.job, { title: Fm.t.trim(), pay: price, desc: Fm.desc, exact: Fm.exact, head: +Fm.head || 1, reqs: Fm.reqs.filter(r => r.trim()) });
    } else {
      S.newPosts.push({ id: "n" + Date.now(), k: T, t: Fm.t.trim() || "Bài nháp chưa đặt tên", img: Fm.imgs[0], ic: Fm.imgs[0] ? undefined : KIND[T][0], price, unit, val, max: Math.max(val, 20), on: draft ? 0 : 1, views: 0, saves: 0, sold: 0, cat, desc: Fm.desc, form });
      A.save(S);
    }
    dirty = false; submitted = { draft, T }; render(); window.scrollTo(0, 0);
  }
  function renderDone() {
    const { draft, T } = submitted;
    page.innerHTML = `<div class="done"><img src="assets/clean/${draft ? "idle" : "wave"}.png" alt=""><h1>${existing ? "Đã lưu thay đổi" : draft ? "Đã lưu nháp" : T === "job" ? "Đã đăng việc!" : "Đã đăng bài!"}</h1>
      <p>${existing ? "Khách thấy nội dung mới ngay." : draft ? "Bài chưa hiện cho khách. Bật “Mở bán” ở Bài đăng khi sẵn sàng." : T === "job" ? "Hàng xóm trong khu thấy việc ở “Việc mới quanh bạn”. Có đề nghị là bạn nhận thông báo." : "Bài hiện ở “Gần bạn” cho hàng xóm trong khu. Có đơn là bạn nhận thông báo."}</p>
      <div class="btns"><a class="btn primary" href="seller-posts.html">Xem Bài đăng</a><a class="btn" href="seller-post-form.html?type=${T}">Đăng bài khác</a><a class="btn" href="seller.html">Về Hôm nay</a></div></div>`;
  }
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  render();
})();
</script>
</body></html>
